<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icon utama PWA -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King Barbershop</title>

    <!-- Apple install -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-512x512.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- App React -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register PWA Service Worker (wajib dinyalakan untuk build) -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
